# Builds the documentation site with pkgdown and publishes it to https://eka.nz/docs
# (S3 bucket eka-nz-site, served by CloudFront distribution E2Y2J5TXS8QQHB).
# AWS access is by OIDC: only this repository's master branch can assume the role, and the role
# can only write the docs files and invalidate the distribution. No secrets are needed.
# See enzKinet_webpage/docs/public-docs.md.
name: pkgdown

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pkgdown
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::523955943775:role/eka-docs-publish
  BUCKET: eka-nz-site
  DISTRIBUTION: E2Y2J5TXS8QQHB

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 and refresh CloudFront
        run: |
          aws s3 sync docs/ "s3://$BUCKET/docs/" --delete --cache-control "max-age=300" --only-show-errors
          aws s3 cp tools/site-root/robots.txt "s3://$BUCKET/robots.txt" --content-type "text/plain" --cache-control "max-age=3600" --only-show-errors
          aws s3 cp pkgdown/favicon/favicon.ico "s3://$BUCKET/favicon.ico" --content-type "image/x-icon" --cache-control "max-age=86400" --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/docs/*" "/robots.txt" "/favicon.ico" --query Invalidation.Id --output text
